<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Work Days</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Work Days</h1>
      <p class="page-subtitle">Tap a day you worked. It's saved automatically.</p>
    </header>

    <section class="calendar-card" aria-label="Work calendar">
      <div class="calendar-nav">
        <button type="button" class="nav-btn" id="prevMonth" aria-label="Previous month">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <h2 class="month-label" id="monthLabel" aria-live="polite"></h2>
        <button type="button" class="nav-btn" id="nextMonth" aria-label="Next month">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M9 18l6-6-6-6" />
          </svg>
        </button>
      </div>

      <div class="weekday-row" aria-hidden="true">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>

      <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="Days of the month"></div>
    </section>

    <section class="summary-card" aria-label="Month summary">
      <span class="summary-count" id="summaryCount">0</span>
      <span class="summary-text">days worked this month</span>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
